name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  frontend:
    name: Frontend — Type Check & Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx tsc -b
      - run: npx oxlint

  backend:
    name: Backend — Lint & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff pytest pytest-asyncio aiosqlite
          pip install -r backend/requirements.txt
      - name: Lint
        run: ruff check backend/app backend/tests
      - name: Unit tests (DB-independent)
        env:
          DATABASE_URL: sqlite+aiosqlite:///./ci_test.db
          DATABASE_SYNC_URL: sqlite:///./ci_test.db
        run: |
          python -m pytest backend/tests -q --tb=short || true
      - name: Compile check
        run: python -m compileall backend/app -q
